[project]
name = "cotador-data-pipeline"
version = "0.1.0"
description = "Prototype of a data pipeline that keeps health-plan quotes reliable and up to date."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]
# Operator material uses the en dash in regions and age bands ("São Paulo – Capital").
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]
